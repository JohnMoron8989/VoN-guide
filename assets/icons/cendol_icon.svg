<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="glassClip">
      <path d="M126,150 L386,150 L356,446 Q354,458 342,458 L170,458 Q158,458 156,446 Z"/>
    </clipPath>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f3fa"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f6e6c4"/>
    </linearGradient>
    <linearGradient id="syrup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8692c"/>
      <stop offset="1" stop-color="#7a3f18"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="262" cy="474" rx="132" ry="16" fill="#000" opacity="0.22"/>

  <!-- glass back -->
  <path d="M126,150 L386,150 L356,446 Q354,458 342,458 L170,458 Q158,458 156,446 Z" fill="#e9f5fb" opacity="0.55"/>

  <!-- contents -->
  <g clip-path="url(#glassClip)">
    <!-- shaved ice layer -->
    <rect x="100" y="150" width="320" height="95" fill="url(#ice)"/>
    <!-- coconut milk layer -->
    <rect x="100" y="245" width="320" height="120" fill="url(#milk)"/>
    <!-- palm sugar syrup layer -->
    <rect x="100" y="365" width="320" height="110" fill="url(#syrup)"/>
    <path d="M100,365 Q140,352 180,366 T260,364 T340,367 T420,362 L420,380 L100,380 Z" fill="#b8692c"/>

    <!-- red beans -->
    <g fill="#b3262e" stroke="#3a1014" stroke-width="5">
      <ellipse cx="192" cy="424" rx="13" ry="9" transform="rotate(-20 192 424)"/>
      <ellipse cx="238" cy="436" rx="13" ry="9" transform="rotate(15 238 436)"/>
      <ellipse cx="288" cy="426" rx="13" ry="9" transform="rotate(-10 288 426)"/>
      <ellipse cx="326" cy="438" rx="13" ry="9" transform="rotate(25 326 438)"/>
    </g>

    <!-- cendol worms (outline then fill) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#1f4a1c" stroke-width="26">
        <path d="M170,276 q20,-26 40,0 t40,0"/>
        <path d="M250,318 q18,-24 36,0 t36,0"/>
        <path d="M168,340 q18,-22 34,0 t34,0"/>
        <path d="M200,404 q22,-26 44,0 t44,0"/>
        <path d="M260,396 q16,-20 32,0 t32,0"/>
        <path d="M180,212 q18,-22 36,0"/>
      </g>
      <g stroke="#6bd05a" stroke-width="15">
        <path d="M170,276 q20,-26 40,0 t40,0"/>
        <path d="M250,318 q18,-24 36,0 t36,0"/>
        <path d="M168,340 q18,-22 34,0 t34,0"/>
        <path d="M200,404 q22,-26 44,0 t44,0"/>
        <path d="M260,396 q16,-20 32,0 t32,0"/>
        <path d="M180,212 q18,-22 36,0"/>
      </g>
    </g>
  </g>

  <!-- straw (behind mound) -->
  <g stroke-linecap="round">
    <line x1="318" y1="150" x2="372" y2="40" stroke="#3a2418" stroke-width="30"/>
    <line x1="318" y1="150" x2="372" y2="40" stroke="#ff6f6a" stroke-width="16"/>
    <line x1="326" y1="132" x2="336" y2="112" stroke="#fff" stroke-width="16" opacity="0.0"/>
  </g>

  <!-- shaved ice mound (bumpy) -->
  <path d="M120,152 Q104,134 128,118 Q116,92 152,86 Q156,56 196,64 Q216,36 254,54 Q290,34 312,66 Q352,62 358,96 Q394,100 384,128 Q408,142 392,152 Z"
        fill="#fbfdff" stroke="#3a2418" stroke-width="12" stroke-linejoin="round"/>
  <path d="M128,140 Q200,160 256,152 Q330,160 386,140 L392,152 L120,152 Z" fill="#d3e8f4"/>
  <g fill="#cfe5f2">
    <circle cx="170" cy="112" r="7"/><circle cx="226" cy="90" r="6"/><circle cx="300" cy="96" r="7"/><circle cx="350" cy="122" r="6"/>
  </g>

  <!-- palm sugar drizzle -->
  <path d="M170,104 Q206,64 258,66 Q312,66 344,104 Q338,112 332,126 Q324,136 314,124 Q306,106 294,118 Q286,142 274,114 Q258,96 242,116 Q230,138 220,118 Q210,100 198,120 Q188,142 178,120 Z"
        fill="url(#syrup)" stroke="#3a2418" stroke-width="7" stroke-linejoin="round"/>
  <path d="M200,86 Q226,74 248,78" stroke="#e3a46b" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- glass outline -->
  <path d="M126,150 L386,150 L356,446 Q354,458 342,458 L170,458 Q158,458 156,446 Z"
        fill="none" stroke="#3a2418" stroke-width="12" stroke-linejoin="round"/>
  <!-- rim -->
  <line x1="120" y1="150" x2="392" y2="150" stroke="#3a2418" stroke-width="12" stroke-linecap="round"/>
  <!-- glass highlight -->
  <path d="M150,178 L170,420" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M362,190 L352,260" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
